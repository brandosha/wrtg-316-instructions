<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How to Run the Dinosaur Game</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="/assets/style.css" rel="stylesheet" />
  </head>
  <body>
    <div v-scope class="container py-3">
      <h1 class="mb-4">How to Run the Dinosaur Game</h1>
      <h5>Platform</h5>
      <div class="row">
        <div class="col col-lg-4 mb-3">
          <div class="list-group list-group-horizontal mb-3">
            <label
              v-for="p in app.platforms"
              class="list-group-item list-group-item-action text-center"
              :class="{ active: app.platform === p }"
              role="button"
            >
              <input
                class="btn-check"
                type="radio"
                name="platform"
                v-bind:value="p"
                :checked="app.platform === p"
                @change="app.changePlatform(p)"
              />
              {{ p }}
            </label>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-sm-4 mb-4">
          <div class="list-group">
            <a
              v-for="step in app.steps"
              class="list-group-item list-group-item-action"
              v-bind:class="{ active: app.currentStep === step.stepNumber }"
              href="#"
              @click.prevent="app.goToStep(step.stepNumber)"
            >
              {{ app.getStep(step.stepNumber).title }}
            </a>
          </div>
        </div>

        <div class="col-12 col-sm-8 instruction-content">
          <div
            v-for="step in app.steps"
            v-show="app.currentStep === step.stepNumber"
          >
            <div v-scope="app.getStep(step.stepNumber)"></div>

            <div class="d-flex justify-content-between">
              <button
                class="btn btn-primary"
                :disabled="app.currentStep <= 0"
                @click="app.goToStep(app.currentStep - 1)"
              >
                ← Previous
              </button>

              <button
                class="btn btn-primary"
                :disabled="app.currentStep >= app.steps.length - 1"
                @click="app.goToStep(app.currentStep + 1)"
              >
                Next →
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <template
      id="step-0-template"
      data-title-windows="Introduction"
      data-title-mac="Introduction"
      data-title-linux="Introduction"
      ><div>
        <h2>{{ app.getStep(stepNumber).title }}</h2>
        <p>
          These instructions will walk you through the steps to download a game
          from a website called GitHub which is a popular website that software
          developers use to post their code to. GitHub is a lot like Google Docs
          but made specifically for people to work on code together. In these
          instructions you will open GitHub, download a program for a simple
          game, and run that game on your own computer.
        </p>
        <p>
          Select your operating system above, then choose
          <strong>Next</strong> to begin. Troubleshooting notes below the
          instructions explain how to resolve common problems.
        </p>

        <!-- <p>
          Learn how to download and run a dinosaur game in your computer's
          terminal. You will check the tools you need, download the game, and
          use keyboard controls to play.
        </p>
        <p>
          Before you begin, make sure you have an internet connection and
          permission to install software on your computer. The game uses Git to
          download its files and Python to run.
        </p>
        <p>
          Select your operating system above, then choose
          <strong>Next</strong> to begin. Troubleshooting notes below the
          instructions explain how to resolve common problems.
        </p> -->
      </div></template
    >

    <template
      id="step-1-template"
      data-title-windows="Step 1: Open the Command Prompt"
      data-title-mac="Step 1: Open the Terminal"
      data-title-linux="Step 1: Open the Terminal"
      ><template v-if="app.platform === 'Windows'"
        ><div>
          <h2>{{ app.getStep(stepNumber).title }}</h2>
          <ol>
            <li>
              Click the <strong>Start</strong> button.
              <figure
                v-if="app.platform === 'Windows'"
                class="figure d-block my-3"
              >
                <a
                  href="./assets/images/windows/startButton.png"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Open full-size image: Click the Start button."
                  ><img
                    src="./assets/images/windows/startButton.png"
                    class="figure-img img-fluid rounded border"
                    alt="Windows Start menu with an arrow pointing to the Start button."
                    loading="lazy"
                    decoding="async"
                /></a>
                <figcaption class="figure-caption">
                  Click the Start button. Select the image to view it full size.
                </figcaption>
              </figure>
            </li>
            <li>Type <code>cmd</code>.</li>
            <li>
              Click <strong>Command Prompt</strong>.
              <figure
                v-if="app.platform === 'Windows'"
                class="figure d-block my-3"
              >
                <a
                  href="./assets/images/windows/cmdShowing.png"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Open full-size image: Search for cmd and open Command Prompt."
                  ><img
                    src="./assets/images/windows/cmdShowing.png"
                    class="figure-img img-fluid rounded border"
                    alt="Windows search for cmd showing Command Prompt as the best match."
                    loading="lazy"
                    decoding="async"
                /></a>
                <figcaption class="figure-caption">
                  Search for cmd and open Command Prompt. Select the image to
                  view it full size.
                </figcaption>
              </figure>
            </li>
          </ol>
          <p>
            A black window opens with a line such as
            <code>C:\Users\YourName&gt;</code>. This window is the Command
            Prompt.
          </p>
        </div></template
      ><template v-if="app.platform === 'Mac'"
        ><div>
          <h2>{{ app.getStep(stepNumber).title }}</h2>
          <ol>
            <li>
              Press <strong>Command + Space</strong> to open Spotlight Search.
              <figure v-if="app.platform === 'Mac'" class="figure d-block my-3">
                <a
                  href="./assets/images/macos/keyboard.png"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Open full-size image: Press Command + Space to open Spotlight."
                >
                  <img
                    src="./assets/images/macos/keyboard.png"
                    class="figure-img img-fluid rounded border"
                    alt="Mac keyboard with Command and Space highlighted."
                    loading="lazy"
                    decoding="async"
                  />
                </a>
                <figcaption class="figure-caption">
                  Press Command + Space to open Spotlight. Select the image to
                  view it full size.
                </figcaption>
              </figure>
            </li>
            <li>
              Type <code>Terminal</code> and press <strong>Return</strong>.
              <figure v-if="app.platform === 'Mac'" class="figure d-block my-3">
                <a
                  href="./assets/images/macos/spotlightSearch.png"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Open full-size image: Search for Terminal and press Return."
                >
                  <img
                    src="./assets/images/macos/spotlightSearch.png"
                    class="figure-img img-fluid rounded border"
                    alt="Spotlight Search showing Terminal as the first result."
                    loading="lazy"
                    decoding="async"
                  />
                </a>
                <figcaption class="figure-caption">
                  Search for Terminal and press Return. Select the image to view
                  it full size.
                </figcaption>
              </figure>
            </li>
          </ol>
          <p>
            A window opens with a line of text that ends in <code>%</code>. This
            window is the terminal.
          </p>
        </div></template
      ><template v-if="app.platform === 'Linux'"
        ><div>
          <h2>{{ app.getStep(stepNumber).title }}</h2>
          <p>Press <strong>Ctrl + Alt + T</strong>.</p>
          <p>
            A window opens with a line of text that ends in <code>$</code>. This
            window is the terminal.
          </p>
          <aside
            class="alert alert-info mt-3"
            role="note"
            aria-label="Troubleshooting"
          >
            <h3 class="h6">Troubleshooting</h3>
            <p>
              <strong
                ><strong>Ctrl + Alt + T</strong> does not open the
                terminal</strong
              ><br />Open the applications menu, search for
              <strong>Terminal</strong>, and click it.
            </p>
          </aside>
        </div></template
      ></template
    >

    <template
      id="step-2-template"
      data-title-windows="Step 2: Confirm That Git and Python Are Installed"
      data-title-mac="Step 2: Confirm That Git and Python Are Installed"
      data-title-linux="Step 2: Confirm That Git and Python Are Installed"
      ><div>
        <h2>{{ app.getStep(stepNumber).title }}</h2>
        <ol>
          <li>
            Type the following command and press
            <strong
              ><template
                v-if="app.platform === 'Windows' || app.platform === 'Linux'"
                >Enter</template
              ><template v-if="app.platform === 'Mac'">Return</template></strong
            >:
            <div v-scope='CodeBlock({ code: "git --version" })'></div>
            <figure
              v-if="app.platform === 'Windows'"
              class="figure d-block my-3"
            >
              <a
                href="./assets/images/windows/winGitVersion.png"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open full-size image: An example of Git version output."
                ><img
                  src="./assets/images/windows/winGitVersion.png"
                  class="figure-img img-fluid rounded border"
                  alt="Command Prompt showing git --version and a Git version number."
                  loading="lazy"
                  decoding="async"
              /></a>
              <figcaption class="figure-caption">
                An example of Git version output. Select the image to view it
                full size.
              </figcaption>
            </figure>
            <figure v-if="app.platform === 'Mac'" class="figure d-block my-3">
              <a
                href="./assets/images/macos/gitVersion.png"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open full-size image: An example of Git version output."
              >
                <img
                  src="./assets/images/macos/gitVersion.png"
                  class="figure-img img-fluid rounded border"
                  alt="Terminal showing git --version and an installed Git version."
                  loading="lazy"
                  decoding="async"
                />
              </a>
              <figcaption class="figure-caption">
                An example of Git version output. Select the image to view it
                full size.
              </figcaption>
            </figure>
          </li>
          <li>
            Type the following command and press
            <strong
              ><template
                v-if="app.platform === 'Windows' || app.platform === 'Linux'"
                >Enter</template
              ><template v-if="app.platform === 'Mac'">Return</template></strong
            >:
            <template v-if="app.platform === 'Windows'"
              ><div v-scope='CodeBlock({ code: "py --version" })'></div>
              <figure
                v-if="app.platform === 'Windows'"
                class="figure d-block my-3"
              >
                <a
                  href="./assets/images/windows/winPyVersion.png"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Open full-size image: An example of Python version output."
                  ><img
                    src="./assets/images/windows/winPyVersion.png"
                    class="figure-img img-fluid rounded border"
                    alt="Command Prompt showing py --version and Python 3.14.3."
                    loading="lazy"
                    decoding="async"
                /></a>
                <figcaption class="figure-caption">
                  An example of Python version output. Select the image to view
                  it full size.
                </figcaption>
              </figure></template
            ><template v-if="app.platform === 'Mac' || app.platform === 'Linux'"
              ><div v-scope='CodeBlock({ code: "python3 --version" })'></div
            ></template>
            <figure v-if="app.platform === 'Mac'" class="figure d-block my-3">
              <a
                href="./assets/images/macos/pythonVersion.png"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open full-size image: An example of Python version output."
              >
                <img
                  src="./assets/images/macos/pythonVersion.png"
                  class="figure-img img-fluid rounded border"
                  alt="Terminal showing python3 --version and Python 3.11.5."
                  loading="lazy"
                  decoding="async"
                />
              </a>
              <figcaption class="figure-caption">
                An example of Python version output. Select the image to view it
                full size.
              </figcaption>
            </figure>
          </li>
        </ol>
        <p>
          Each command should display a version number, such as
          <code
            ><template v-if="app.platform === 'Windows'"
              >git version 2.47.0.windows.1</template
            ><template v-if="app.platform === 'Mac'"
              >git version 2.39.5</template
            ><template v-if="app.platform === 'Linux'"
              >git version 2.43.0</template
            ></code
          >
          or
          <code
            ><template v-if="app.platform === 'Windows'">Python 3.13.0</template
            ><template v-if="app.platform === 'Mac'">Python 3.9.6</template
            ><template v-if="app.platform === 'Linux'"
              >Python 3.12.3</template
            ></code
          >.
        </p>
        <p
          v-if="app.platform === 'Mac' || app.platform === 'Windows'"
          class="text-muted"
        >
          Your username, computer name, and version numbers may differ from
          these examples.
        </p>
        <template v-if="app.platform === 'Windows'"
          ><aside
            class="alert alert-info mt-3"
            role="note"
            aria-label="Troubleshooting"
          >
            <h3 class="h6">Troubleshooting</h3>
            <p>
              <strong
                ><code
                  >is not recognized as an internal or external command</code
                >
                appears</strong
              ><br />Close and reopen the Command Prompt, then try again. If the
              error remains, install Git from <strong>git-scm.com</strong> and
              Python from <strong>python.org</strong>. In the Python installer,
              check the box labeled <strong>Add python.exe to PATH</strong>.
            </p>
            <p>
              <strong
                >Typing <code>python</code> opens the Microsoft Store</strong
              ><br />Type <code>py</code> instead of <code>python</code>, as
              shown in these instructions.
            </p>
            <p>
              <strong>The Command Prompt stops responding</strong><br />Press
              <strong>Ctrl + C</strong> to stop the current command.
            </p>
          </aside></template
        ><template v-if="app.platform === 'Mac'"
          ><aside
            class="alert alert-info mt-3"
            role="note"
            aria-label="Troubleshooting"
          >
            <h3 class="h6">Troubleshooting</h3>
            <p>
              <strong><code>python3: command not found</code> appears</strong
              ><br />
              Download and install Python from
              <a
                href="https://www.python.org/downloads/macos/"
                target="_blank"
                rel="noopener noreferrer"
                >the Python download site</a
              >. Close and reopen Terminal, then run
              <code>python3 --version</code> again.
            </p>
            <p>
              <strong><code>git: command not found</code> appears</strong><br />
              Install Git with Homebrew:
            </p>
            <ol>
              <li>
                If Homebrew is not installed, follow the installation
                instructions at
                <a
                  href="https://brew.sh/"
                  target="_blank"
                  rel="noopener noreferrer"
                  >brew.sh</a
                >. Follow the installer's <strong>Next steps</strong> to make
                the <code>brew</code> command available in Terminal.
              </li>
              <li>
                Type the following command and press <strong>Return</strong>:
                <div v-scope='CodeBlock({ code: "brew install git" })'></div>
                Wait for the installation to finish.
              </li>
              <li>
                Close and reopen Terminal, then run
                <code>git --version</code> again to confirm that Git is
                installed.
              </li>
            </ol>
            <p>
              If <code>brew: command not found</code> appears, complete the
              Homebrew installer's <strong>Next steps</strong>, then try again.
            </p>
            <p>
              <strong>The Terminal stops responding</strong><br />Press
              <strong>Control + C</strong> to stop the current command.
            </p>
          </aside></template
        ><template v-if="app.platform === 'Linux'"
          ><aside
            class="alert alert-info mt-3"
            role="note"
            aria-label="Troubleshooting"
          >
            <h3 class="h6">Troubleshooting</h3>
            <p>
              <strong><code>command not found</code> appears</strong><br />Git
              or Python is not installed. Type
              <code>sudo apt install -y git python3</code> (on Fedora,
              <code>sudo dnf install -y git python3</code>), press
              <strong>Enter</strong>, and enter your computer password when
              asked.
            </p>
            <p>
              <strong>The terminal stops responding</strong><br />Press
              <strong>Ctrl + C</strong> to stop the current command.
            </p>
          </aside></template
        >
      </div></template
    >

    <template
      id="step-3-template"
      data-title-windows="Step 3: Move to Your User Folder"
      data-title-mac="Step 3: Move to Your Home Folder"
      data-title-linux="Step 3: Move to Your Home Folder"
      ><div>
        <h2>{{ app.getStep(stepNumber).title }}</h2>
        <p>
          Type the following command and press
          <strong
            ><template
              v-if="app.platform === 'Windows' || app.platform === 'Linux'"
              >Enter</template
            ><template v-if="app.platform === 'Mac'">Return</template></strong
          >:
        </p>
        <template v-if="app.platform === 'Windows'"
          ><div
            v-scope='CodeBlock({ code: "cd %USERPROFILE%" })'
          ></div></template
        ><template v-if="app.platform === 'Mac' || app.platform === 'Linux'"
          ><div v-scope='CodeBlock({ code: "cd ~" })'></div
        ></template>
        <figure v-if="app.platform === 'Mac'" class="figure d-block my-3">
          <a
            href="./assets/images/macos/cdHome.png"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open full-size image: The cd ~ command returns you to your home folder."
          >
            <img
              src="./assets/images/macos/cdHome.png"
              class="figure-img img-fluid rounded border"
              alt="Terminal showing cd ~ and a home-folder prompt."
              loading="lazy"
              decoding="async"
            />
          </a>
          <figcaption class="figure-caption">
            The cd ~ command returns you to your home folder. Select the image
            to view it full size.
          </figcaption>
        </figure>
        <figure v-if="app.platform === 'Windows'" class="figure d-block my-3">
          <a
            href="./assets/images/windows/cdWindows.png"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open full-size image: Use cd %USERPROFILE% to return to your user folder. Earlier commands shown are example history."
            ><img
              src="./assets/images/windows/cdWindows.png"
              class="figure-img img-fluid rounded border"
              alt="Command Prompt showing cd %USERPROFILE% and the user-folder prompt."
              loading="lazy"
              decoding="async"
          /></a>
          <figcaption class="figure-caption">
            Use cd %USERPROFILE% to return to your user folder. Earlier commands
            shown are example history. Select the image to view it full size.
          </figcaption>
        </figure>
        <aside
          class="alert alert-info mt-3"
          role="note"
          aria-label="Troubleshooting"
        >
          <h3 class="h6">Troubleshooting</h3>
          <p>
            <strong
              ><template v-if="app.platform === 'Windows'"
                >The Command Prompt stops responding</template
              ><template v-if="app.platform === 'Mac'"
                >The Terminal stops responding</template
              ><template v-if="app.platform === 'Linux'"
                >The terminal stops responding</template
              ></strong
            ><br />Press
            <strong
              ><template
                v-if="app.platform === 'Windows' || app.platform === 'Linux'"
                >Ctrl + C</template
              ><template v-if="app.platform === 'Mac'"
                >Control + C</template
              ></strong
            >
            to stop the current command.
          </p>
        </aside>
      </div></template
    >

    <template
      id="step-4-template"
      data-title-windows="Step 4: Download (Clone) the Program"
      data-title-mac="Step 4: Download (Clone) the Program"
      data-title-linux="Step 4: Download (Clone) the Program"
      ><div>
        <h2>{{ app.getStep(stepNumber).title }}</h2>
        <p>
          Type the following command and press
          <strong
            ><template
              v-if="app.platform === 'Windows' || app.platform === 'Linux'"
              >Enter</template
            ><template v-if="app.platform === 'Mac'">Return</template></strong
          >:
        </p>
        <div
          v-scope='CodeBlock({ code: "git clone https://github.com/trevorwattles/wrtg-316-instructions.git" })'
        ></div>
        <p>
          Wait until the line <code>Receiving objects: 100%</code> appears and
          the cursor returns.
        </p>
        <figure v-if="app.platform === 'Mac'" class="figure d-block my-3">
          <a
            href="./assets/images/macos/gitClone.png"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open full-size image: The download is complete when the prompt returns."
          >
            <img
              src="./assets/images/macos/gitClone.png"
              class="figure-img img-fluid rounded border"
              alt="Terminal showing the clone command and Receiving objects: 100%."
              loading="lazy"
              decoding="async"
            />
          </a>
          <figcaption class="figure-caption">
            The download is complete when the prompt returns. Select the image
            to view it full size.
          </figcaption>
        </figure>
        <figure v-if="app.platform === 'Windows'" class="figure d-block my-3">
          <a
            href="./assets/images/windows/winGitClone.png"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open full-size image: The download is complete when the prompt returns. Earlier commands shown are example history."
            ><img
              src="./assets/images/windows/winGitClone.png"
              class="figure-img img-fluid rounded border"
              alt="Command Prompt showing git clone and completed download output."
              loading="lazy"
              decoding="async"
          /></a>
          <figcaption class="figure-caption">
            The download is complete when the prompt returns. Earlier commands
            shown are example history. Select the image to view it full size.
          </figcaption>
        </figure>
        <aside
          class="alert alert-info mt-3"
          role="note"
          aria-label="Troubleshooting"
        >
          <h3 class="h6">Troubleshooting</h3>
          <p>
            <strong
              ><code>destination path ... already exists</code> appears</strong
            ><br />The program is already downloaded. Continue to
            <span v-scope="StepLink({ stepNumber: 5 })"></span>.
          </p>
          <p>
            <strong
              ><template v-if="app.platform === 'Windows'"
                >The Command Prompt stops responding</template
              ><template v-if="app.platform === 'Mac'"
                >The Terminal stops responding</template
              ><template v-if="app.platform === 'Linux'"
                >The terminal stops responding</template
              ></strong
            ><br />Press
            <strong
              ><template
                v-if="app.platform === 'Windows' || app.platform === 'Linux'"
                >Ctrl + C</template
              ><template v-if="app.platform === 'Mac'"
                >Control + C</template
              ></strong
            >
            to stop the current command.
          </p>
        </aside>
      </div></template
    >

    <template
      id="step-5-template"
      data-title-windows="Step 5: Open the Program&#x27;s Folder"
      data-title-mac="Step 5: Open the Program&#x27;s Folder"
      data-title-linux="Step 5: Open the Program&#x27;s Folder"
      ><div>
        <h2>{{ app.getStep(stepNumber).title }}</h2>
        <p>
          Type the following command and press
          <strong
            ><template
              v-if="app.platform === 'Windows' || app.platform === 'Linux'"
              >Enter</template
            ><template v-if="app.platform === 'Mac'">Return</template></strong
          >:
        </p>
        <div v-scope='CodeBlock({ code: "cd wrtg-316-instructions" })'></div>
        <figure v-if="app.platform === 'Mac'" class="figure d-block my-3">
          <a
            href="./assets/images/macos/cdWriting.png"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open full-size image: Open the downloaded program folder."
          >
            <img
              src="./assets/images/macos/cdWriting.png"
              class="figure-img img-fluid rounded border"
              alt="Terminal showing cd wrtg-316-instructions and the updated folder prompt."
              loading="lazy"
              decoding="async"
            />
          </a>
          <figcaption class="figure-caption">
            Open the downloaded program folder. Select the image to view it full
            size.

    <script src="https://unpkg.com/petite-vue"></script>
    <script>
      let deviceOS = (() => {
        let platform = navigator.platform.toLowerCase();
        if (platform.startsWith("win")) return "Windows";
        if (platform.startsWith("mac")) return "Mac";
        if (platform.startsWith("linux")) return "Linux";
        return null;
      })();

      // Read each instruction template once; reuse its component for every lookup.
      const instructionSteps = new Map();
      const stepNumbers = new Set();
      for (const template of document.querySelectorAll(
        'template[id^="step-"][data-title-windows]',
      )) {
        const match = template.id.match(/^step-(\d+)-template$/);
        if (!match) continue;
        const stepNumber = Number(match[1]);
        for (const platform of ["Windows", "Mac", "Linux"]) {
          instructionSteps.set(`${stepNumber}:${platform}`, {
            stepNumber,
            platform,
            title: template.dataset[`title${platform}`],
            $template: `#${template.id}`,
          });
        }
        stepNumbers.add(stepNumber);
      }

      let app = PetiteVue.reactive({
        platforms: ["Windows", "Mac", "Linux"],
        platform: deviceOS || "Linux",
        steps: [...stepNumbers]
          .sort((a, b) => a - b)
          .map((stepNumber) => ({ stepNumber })),
        currentStep: 0,

        getStep(stepNumber, platform = this.platform) {
          if (
            !Number.isInteger(stepNumber) ||
            !this.platforms.includes(platform)
          )
            return null;
          return instructionSteps.get(`${stepNumber}:${platform}`) || null;
        },

        goToStep(stepNumber) {
          const toStep = this.getStep(stepNumber);
          if (!toStep) return;
          this.recordInteraction("step_change", {
            fromStep: this.getStep(this.currentStep).title,
            toStep: toStep.title,
          });
          this.currentStep = stepNumber;

          if (stepNumber === 0) this.reset();
        },
        changePlatform(newPlatform) {
          if (this.platforms.includes(newPlatform)) {
            let oldPlatform = this.platform;
            this.platform = newPlatform;
            this.recordInteraction("platform_change", {
              from: oldPlatform,
              to: newPlatform,
            });
          }
        },

        reset() {
          this.currentStep = 0;
          this.interaction_data = [
            {
              action: "start",
              start_time: new Date().toISOString(),
            },
          ];
        },
        recordInteraction(action, details = {}) {
          this.interaction_data.push({
            action,
            ...details,
            timestamp: new Date().toISOString(),
          });
        },

        interaction_data: [],
        getformUrl() {
          return `https://docs.google.com/forms/d/e/1FAIpQLSc72u-MWgYh8_HAQXXTlufcHuKQKIXX183iPzKUAeMPgupUmA/viewform?usp=pp_url&entry.1245076436=${encodeURIComponent(JSON.stringify(this.interaction_data))}`;
        },
      });
      app.reset();

      // Step numbers use the same zero-based indexing as app.getStep().
      function StepLink({ stepNumber }) {
        return {
          $template: "#step-link-template",
          stepNumber,
          follow() {
            app.goToStep(this.stepNumber);
          },
        };
      }

      function CodeBlock({ code }) {
        return {
          $template: "#code-block-template",
          code,
          async copy() {
            await navigator.clipboard.writeText(this.code);
            app.recordInteraction("copy_code", { code: this.code });
          },
        };
      }

      PetiteVue.createApp({ app, StepLink, CodeBlock }).mount();

      // Catch standard runtime errors (syntax, reference, type errors)
      window.addEventListener("error", (event) => {
        console.error("Global Error Caught:", event.error || event.message);
        // Send to your error monitoring service here

        app.recordInteraction("error", {
          message: event.error ? event.error.message : event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno,
        });
      });

      // Catch unhandled promise rejections (async/await, fetch failures)
      window.addEventListener("unhandledrejection", (event) => {
        console.error("Unhandled Promise Rejection:", event.reason);

        app.recordInteraction("unhandled_rejection", {
          reason: event.reason,
        });
      });
    </script>
